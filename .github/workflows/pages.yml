name: Enable Pages

on:
  push:
    branches: ["main", "master"]

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://github.com{{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true

