name: Deploy Jekyll Site

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-enable GitHub Pages
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://github.com{{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || echo "Pages already enabled"

      - name: Create CNAME for domain
        run: echo "ru-doctor.ru" > CNAME

      - name: Build site with Docker Jekyll
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/srv/jekyll \
            jekyll/builder:latest \
            jekyll build --destination ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: setup-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
