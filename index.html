  <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ру Доктор | Медицинский блог</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 25px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #03045e;
        }
        .subtitle {
            color: #0077b6;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .links a {
            display: block;
            background-color: #0077b6;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
        }
        .links a:hover {
            background-color: #03045e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">РД</div>
        <h1>Ру Доктор</h1>
        <div class="subtitle">Медицинский блог</div>
        <p>Официальная визитка проекта. Скоро здесь будут полезные материалы о здоровье, разборы медицинских мифов и экспертные статьи.</p>
        
        <div class="links">
            <a href="https://t.me" target="_blank">Наш Telegram-канал</a>
            <a href="https://dzen.ru" target="_blank">Мы на Яндекс.Дзен</a>
            <a href="https://youtube.com" target="_blank">Смотреть на YouTube</a>
        </div>
    </div>

</body>
</html>
